[package]
name = "shrestidb"
version = "0.1.0"
edition = "2021"
authors = ["v4life"]
description = "Full Database Kernel leveraging Learned Indexes and Machine Learning Engine Components."

[lib]
name = "shrestidb"
path = "src/lib.rs"

[[bin]]
name = "db-server"
path = "src/main.rs"

[dependencies]
# Concurrency & Async I/O
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"

# Data Types & Math
ndarray = "0.15"
ndarray-linalg = "0.16"
num-traits = "0.2"
num = "0.4"

# Storage & Serialization
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging & Debugging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Time & Random
rand = "0.8"
chrono = "0.4"

# Hashing
ahash = "0.8"
sqlparser = "0.62.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.8"

[[bench]]
name = "index_benchmark"
harness = false

[[bench]]
name = "optimizer_benchmark"
harness = false

[[bench]]
name = "query_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
